# ===================================================================
spring.datasource.url=jdbc:mariadb://localhost:3306/blogappdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

